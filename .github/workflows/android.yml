name: App Android de diagnóstico

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK e rodar lint
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../skymonitor-diag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skymonitor-diag-apk
          path: skymonitor-diag.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publicar pre-release "android-diag-latest"
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-diag-latest --yes --cleanup-tag || true
          gh release create android-diag-latest skymonitor-diag.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "App de diagnóstico (build ${GITHUB_SHA::7})" \
            --notes "APK de diagnóstico de câmeras para o Sky Monitor. Instruções em android/README.md."
